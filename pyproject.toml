[project]
name = "daily-radar"
version = "0.1.0"
description = "Personal daily intelligence radar for AI, stocks, tech, US markets, Tencent and deals"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
daily-radar = "daily_radar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
